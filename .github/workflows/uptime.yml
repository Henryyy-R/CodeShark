name: uptime

# Checks the health endpoint of both apps and fails the run if either is down.
# GitHub emails the person who last edited this schedule when a scheduled run fails.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: staging
            url: https://staging.desksharkproject.me/api/health
          - name: prod
            url: https://app.desksharkproject.me/api/health
    name: check (${{ matrix.target.name }})
    steps:
      - name: Check health
        env:
          URL: ${{ matrix.target.url }}
        run: |
          # Staging scales to zero, so the first request can be slow. Retry before failing.
          body=$(curl --fail --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 10 --retry-all-errors "$URL")
          echo "$body"
          echo "$body" | grep -q '"status":"active"'